<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sign in – ShortList</title>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;800&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<link href="css/style.css" rel="stylesheet">
</head>
<body>
<div class="auth">
  <aside class="auth-side">
    <a class="brand text-white" href="index.html"><i class="bi bi-journal-check"></i>ShortList</a>
    <div>
      <h2>See why every candidate got their score.</h2>
      <p>Change what matters for the role and watch the ranking move. No hidden scoring.</p>
    </div>
    <small>GLA University, Mathura &middot; Project demo</small>
  </aside>
  <main class="auth-main">
    <form class="auth-form" id="loginForm" novalidate>
      <h1>Sign in</h1>
      <p class="sub">Use the account you registered with.</p>
      <div class="mb-3">
        <label class="form-label" for="email">Work email</label>
        <input class="form-control" id="email" type="email" autocomplete="email" required>
      </div>
      <div class="mb-3">
        <label class="form-label" for="pass">Password</label>
        <div class="input-group">
          <input class="form-control" id="pass" type="password" autocomplete="current-password" required>
          <button class="btn" type="button" id="eye" aria-label="Show password"><i class="bi bi-eye"></i></button>
        </div>
      </div>
      <div class="msg" id="msg" role="alert"></div>
      <button class="btn-main" type="submit">Sign in</button>
      <p class="mt-3 mb-0 small">New recruiter? <a href="register.html">Create an account</a></p>
    </form>
  </main>
</div>
<script src="js/auth.js"></script>
</body>
</html>
