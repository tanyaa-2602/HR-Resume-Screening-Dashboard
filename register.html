<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Create account – ShortList</title>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;800&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<link href="css/style.css" rel="stylesheet">
</head>
<body>
<div class="auth">
  <aside class="auth-side">
    <a class="brand text-white" href="index.html"><i class="bi bi-journal-check"></i>ShortList</a>
    <div>
      <h2>Set up your recruiter account.</h2>
      <p>Accounts are stored in this browser only. Nothing is sent to a server.</p>
    </div>
    <small>GLA University, Mathura &middot; Project demo</small>
  </aside>
  <main class="auth-main">
    <form class="auth-form" id="regForm" novalidate>
      <h1>Create account</h1>
      <p class="sub">Takes under a minute.</p>
      <div class="mb-3">
        <label class="form-label" for="name">Full name</label>
        <input class="form-control" id="name" autocomplete="name" required>
      </div>
      <div class="mb-3">
        <label class="form-label" for="email">Work email</label>
        <input class="form-control" id="email" type="email" autocomplete="email" required>
      </div>
      <div class="row g-3 mb-3">
        <div class="col-6">
          <label class="form-label" for="pass">Password</label>
          <input class="form-control" id="pass" type="password" autocomplete="new-password" required>
        </div>
        <div class="col-6">
          <label class="form-label" for="pass2">Confirm</label>
          <input class="form-control" id="pass2" type="password" autocomplete="new-password" required>
        </div>
      </div>
      <div class="mb-3">
        <label class="form-label" for="role">Your role</label>
        <select class="form-select" id="role">
          <option>HR executive</option><option>Hiring manager</option><option>Campus recruiter</option>
        </select>
      </div>
      <div class="msg" id="msg" role="alert"></div>
      <button class="btn-main" type="submit">Create account</button>
      <p class="mt-3 mb-0 small">Already registered? <a href="login.html">Sign in</a></p>
    </form>
  </main>
</div>
<script src="js/auth.js"></script>
</body>
</html>
