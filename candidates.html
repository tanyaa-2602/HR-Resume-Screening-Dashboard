<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Candidates – ShortList</title>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;800&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<link href="css/style.css" rel="stylesheet">
</head>
<body>
<div class="shell">
  <nav class="side">
    <a class="brand" href="dashboard.html"><i class="bi bi-journal-check"></i>ShortList</a>
    <a class="nav-i" href="dashboard.html"><i class="bi bi-speedometer2"></i>Ranking</a>
    <a class="nav-i on" href="candidates.html"><i class="bi bi-people"></i>Candidates</a>
    <a class="nav-i" href="about.html"><i class="bi bi-info-circle"></i>How scoring works</a>
    <div class="who">
      <b id="userName">Recruiter</b><span id="userRole"></span><br>
      <a href="#" id="logout" class="text-white-50"><i class="bi bi-box-arrow-left"></i> Sign out</a>
    </div>
  </nav>
  <main class="main">
    <div class="topbar"><div><h1>Candidates</h1><p>Sample profiles bundled with the project.</p></div></div>
    <div class="box">
      <div class="table-responsive">
        <table class="rank"><thead><tr><th>Name</th><th>Applied for</th><th>Experience</th><th>Education</th><th>Skills</th></tr></thead>
        <tbody id="candBody"></tbody></table>
      </div>
    </div>
  </main>
</div>
<script src="js/data.js"></script>
<script src="js/auth.js"></script>
<script>
document.getElementById('candBody').innerHTML = CANDIDATES.map(c => `
  <tr style="cursor:default"><td class="nm"><b>${c.name}</b><small>${c.city}</small></td>
  <td>${c.role}</td><td>${c.exp} yr</td><td>${c.edu}</td>
  <td>${SKILLS.filter(s => c.skills[s] >= 6).map(s => `<span class="tag">${s}</span>`).join('')}</td></tr>`).join('');
</script>
</body>
</html>
